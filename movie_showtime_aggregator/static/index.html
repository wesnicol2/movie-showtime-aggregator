<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movie Showtimes</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">MOVIE SHOWTIMES</p>
        <h1>Screenings</h1>
      </div>
      <p id="result-count">Loading…</p>
    </header>

    <div id="error" class="error" hidden></div>

    <section class="results" aria-live="polite">
      <div class="table-wrap" id="table-wrap">
        <table id="screening-table">
          <thead>
            <tr id="screenings-head"></tr>
          </thead>
          <tbody id="screenings-body"></tbody>
        </table>
      </div>
      <p id="empty-state" class="empty" hidden>No screenings match the active column filters.</p>
    </section>
  </main>

  <div id="column-menu" class="column-menu" hidden></div>
  <script src="/app.js" defer></script>
</body>
</html>
