<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movie Selection · Movie Showtimes</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="movie-selection-page">
  <main class="movie-selection-shell">
    <header class="movie-selection-header">
      <div>
        <p class="eyebrow">MOVIE SHOWTIMES</p>
        <h1>See a Movie</h1>
      </div>
      <nav class="movie-selection-links" aria-label="Pages">
        <a href="/">Screenings</a>
        <a href="/settings">Settings</a>
      </nav>
    </header>

    <div class="movie-selection-toolbar">
      <strong>Now Playing</strong>
      <div class="movie-selection-tools">
        <label>
          <span class="sr-only">Sort movies</span>
          <select id="movie-sort" aria-label="Sort movies">
            <option value="title">Title</option>
            <option value="imdb_rating">IMDb rating</option>
            <option value="rotten_tomatoes_score">Rotten Tomatoes</option>
            <option value="metacritic_score">Metacritic</option>
          </select>
        </label>
        <span id="selected-count">0 selected</span>
      </div>
    </div>

    <div id="movie-selection-error" class="movie-selection-message" hidden></div>
    <section id="movie-grid" class="movie-poster-grid" aria-live="polite">
      <p class="movie-selection-message">Loading posters…</p>
    </section>
  </main>
  <script src="/movies.js" defer></script>
</body>
</html>
