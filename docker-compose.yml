services:
  # Production. Tracks :latest, which CI publishes on every merge to main.
  movie-showtime-aggregator:
    image: ghcr.io/wesnicol2/movie-showtime-aggregator:latest
    env_file:
      # Optional: the defaults below work with no .env at all, so a fresh
      # clone comes up without a setup step. Copy .env.example when you need
      # real config. Requires Compose v2.24+.
      - path: .env
        required: false
    ports:
      - "${PROD_PORT:-8080}:8000"
    volumes:
      - ./data:/srv/data
      - ./common:/srv/common
    restart: unless-stopped

  # Test. Tracks :test, which CI publishes on every merge into a feature
  # branch. Cache/data state stays isolated from Production, while deliberate
  # user configuration (API keys, home address, A-List preference) is shared
  # through ./common so it survives image/container replacement.
  movie-showtime-aggregator-test:
    image: ghcr.io/wesnicol2/movie-showtime-aggregator:test
    env_file:
      # Optional: the defaults below work with no .env at all, so a fresh
      # clone comes up without a setup step. Copy .env.example when you need
      # real config. Requires Compose v2.24+.
      - path: .env
        required: false
    ports:
      - "${TEST_PORT:-8081}:8000"
    volumes:
      - ./data-test:/srv/data
      - ./common:/srv/common
    restart: unless-stopped
