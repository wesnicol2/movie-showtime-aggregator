name: Ruff format bootstrap

on:
  push:
    branches:
      - dev/react-cutover
    paths:
      - movie_showtime_aggregator/api.py
      - .github/workflows/ruff-format-bootstrap.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff format movie_showtime_aggregator/api.py
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add movie_showtime_aggregator/api.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: apply Ruff to SPA static serving"
          git push
