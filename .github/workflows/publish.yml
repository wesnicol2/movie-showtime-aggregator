name: Publish image

on:
  workflow_call:
    inputs:
      image_tag:
        description: "GHCR tag to publish (test | latest)"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      # The built-in GITHUB_TOKEN, not a PAT: a repo spawned from the template
      # can publish with no secret set up by hand. If Actions is configured
      # read-only for the repo this step is what fails first -- see
      # docs/new-repo-checklist.md step 2.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stamp build and commit time
        id: stamp
        run: |
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "commit_at=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      # ghcr.io/<owner>/<repo>, derived from the repository itself, so the
      # bootstrap step never has to rewrite a workflow file.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ inputs.image_tag }}
            type=sha,format=short

      # Watchtower on the home server polls this tag and recreates the matching
      # container when the digest changes. CI never touches the server.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
            IMAGE_TAG=${{ inputs.image_tag }}
            COMMIT_AT=${{ steps.stamp.outputs.commit_at }}
            BUILT_AT=${{ steps.stamp.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
