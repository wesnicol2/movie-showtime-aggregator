name: Temporary Now Playing formatter

on:
  push:
    branches:
      - dev/now-playing-showcase

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run format
      - name: Commit formatting to development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend
          if ! git diff --cached --quiet; then
            git commit -m "Format Now Playing frontend with Biome"
            git push origin HEAD:dev/now-playing-showcase
          fi
