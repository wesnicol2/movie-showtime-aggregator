name: Format frontend bootstrap

on:
  push:
    branches:
      - dev/react-workstation
    paths:
      - frontend/**
      - .github/workflows/frontend-format-bootstrap.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Apply Biome safe fixes
        run: npm run format || true
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: apply Biome to React workstation"
          git push
