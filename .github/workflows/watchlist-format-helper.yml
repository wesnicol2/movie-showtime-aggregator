name: Watchlist temporary formatter

on:
  push:
    branches:
      - dev/watchlist-availability
    paths:
      - .github/workflows/watchlist-format-helper.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Apply pinned formatter
        run: npm run format
      - name: Commit exact formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend
          if ! git diff --staged --quiet; then
            git commit -m "style: apply pinned Biome formatter"
            git push origin HEAD:dev/watchlist-availability
          fi
